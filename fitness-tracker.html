<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fit Tracker</title>
<style>body{font-family:-apple-system,system-ui,sans-serif;margin:0;background:#000;color:#eee}
header{background:#000;color:#3b8bff;padding:16px;text-align:center;font-weight:700;font-size:20px;border-bottom:1px solid #1a2a44}
.tabs{display:flex}.tabs button{flex:1;padding:14px;border:0;background:#0a0a0a;color:#888;font-size:16px;border-bottom:2px solid #222}
.tabs button.on{color:#3b8bff;font-weight:700;border-bottom:2px solid #3b8bff}
.wrap{padding:16px;max-width:520px;margin:auto}
.card{background:#111;border:1px solid #1d2636;border-radius:14px;padding:16px;margin-bottom:14px}
.big{font-size:32px;font-weight:700;color:#fff}.lbl{color:#8a9bb5;font-size:13px;margin-bottom:4px}
.bar{height:10px;background:#1e1e1e;border-radius:6px;overflow:hidden;margin-top:6px}.bar div{height:100%;background:#3b8bff}
.bar.p div{background:#00c2ff}
input,select{width:100%;padding:12px;font-size:16px;border:1px solid #2a3550;border-radius:10px;box-sizing:border-box;margin:4px 0;background:#0a0a0a;color:#fff;color-scheme:dark}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.btn{width:100%;padding:14px;font-size:16px;border:0;border-radius:10px;background:#3b8bff;color:#fff;font-weight:700;margin-top:6px}
.btn.alt{background:#0f2447;color:#7fb2ff}
.step{flex:0 0 44px;height:44px;border-radius:10px;border:1px solid #2a3550;background:#0f2447;color:#7fb2ff;font-size:22px}
.ppl{display:flex;gap:8px}.ppl button{flex:1;padding:16px;font-size:16px;border-radius:10px;border:2px solid #2a3550;background:#0a0a0a;color:#ccc}
.ppl button.on{border-color:#3b8bff;background:#0f2447;color:#fff;font-weight:700}
li{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #1d2636;list-style:none}
ul{padding:0;margin:0}.x{color:#ff5c5c;border:0;background:none;font-size:16px}
header{position:relative}.gear{position:absolute;right:12px;top:10px;background:none;border:0;color:#3b8bff;font-size:24px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:9;align-items:flex-end;justify-content:center}.modal.on{display:flex}
.sheet{background:#111;border-top:1px solid #1d2636;border-radius:16px 16px 0 0;padding:16px;width:100%;max-width:520px;box-sizing:border-box}
.shd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;color:#fff;font-size:18px}.x2{background:none;border:0;color:#3b8bff;font-size:16px;font-weight:700}
.hint{color:#667;font-size:12px}</style></head><body>
<header>Fit Tracker<button class="gear" onclick="setOpen(1)" aria-label="Settings">⚙︎</button></header>
<div id="sm" class="modal" onclick="if(event.target==this)setOpen(0)"><div class="sheet"><div class="shd"><b>Settings</b><button class="x2" onclick="setOpen(0)">Done</button></div>
 <div><div class="lbl">Daily calorie goal</div><div class="row"><button class="step" onclick="adj('c',-50)">−</button><input id="gc" type="number" oninput="setG('c',this.value)"><button class="step" onclick="adj('c',50)">+</button></div>
 <div class="lbl" style="margin-top:10px">Daily protein goal (g)</div><div class="row"><button class="step" onclick="adj('p',-5)">−</button><input id="gp" type="number" oninput="setG('p',this.value)"><button class="step" onclick="adj('p',5)">+</button></div><div class="hint">Saves automatically.</div></div>
</div></div>
<div class="tabs"><button id="t1" class="on" onclick="tab(1)">Nutrition</button><button id="t2" onclick="tab(2)">Workouts</button></div>
<div class="wrap" id="p1">
 <div class="card"><div class="lbl">Calories today</div><div class="big"><span id="cal">0</span> / <span id="calG"></span></div><div class="bar"><div id="calB"></div></div></div>
 <div class="card"><div class="lbl">Protein today (g)</div><div class="big"><span id="pro">0</span> / <span id="proG"></span></div><div class="bar p"><div id="proB"></div></div></div>
 <div class="card"><input id="food" placeholder="Food (e.g. Chicken breast)"><div class="row"><input id="fc" type="number" placeholder="Calories"><input id="fp" type="number" placeholder="Protein g"></div><div class="hint">Fill in calories, protein, or both.</div><button class="btn" onclick="addFood()">Add</button></div>
 <div class="card"><div class="lbl">Today's log</div><ul id="flist"></ul></div>
</div>
<div class="wrap" id="p2" style="display:none">
 <div class="card"><div class="lbl">What did you train?</div><div class="ppl"><button onclick="pick(this)">Push</button><button onclick="pick(this)">Pull</button><button onclick="pick(this)">Legs</button></div>
 <input id="wn" placeholder="Notes (optional, e.g. bench 185x5)"><input id="wd" type="date"><button class="btn" onclick="addW()">Log workout</button></div>
 <div class="card"><div class="lbl">This week: <span id="wk"></span></div></div>
 <div class="card"><div class="lbl">History</div><ul id="wlist"></ul></div>
</div>
<script>
const S=k=>JSON.parse(localStorage.getItem(k)||'null'),W=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const today=()=>new Date().toLocaleDateString('en-CA');
let food_=0;let g=S('goals')||{c:2200,p:160},food=S('food')||{},wo=S('wo')||[],sel=null;
function tab(n){p1.style.display=n==1?'':'none';p2.style.display=n==2?'':'none';t1.className=n==1?'on':'';t2.className=n==2?'on':''}
function render(keep){if(!keep){gc.value=g.c;gp.value=g.p}const d=food[today()]||[];let c=0,p=0;flist.innerHTML='';
 d.forEach((f,i)=>{c+=f.c;p+=f.p;flist.innerHTML+=`<li><span>${f.n}</span><span>${f.c} cal · ${f.p}g <button class="x" onclick="delF(${i})">✕</button></span></li>`});
 cal.textContent=c;pro.textContent=p;calG.textContent=g.c;proG.textContent=g.p;
 calB.style.width=Math.min(100,c/g.c*100)+'%';proB.style.width=Math.min(100,p/g.p*100)+'%';
 wo.sort((a,b)=>b.d.localeCompare(a.d));wlist.innerHTML='';
 wo.forEach((w,i)=>wlist.innerHTML+=`<li><span><b>${w.t}</b> ${w.n||''}</span><span>${w.d} <button class="x" onclick="delW(${i})">✕</button></span></li>`);
 const wkAgo=new Date(Date.now()-6*864e5).toLocaleDateString('en-CA'),r=wo.filter(w=>w.d>=wkAgo);
 wk.textContent=['Push','Pull','Legs'].map(t=>t+' '+r.filter(w=>w.t==t).length).join(' · ')}
function addFood(){const c=+fc.value||0,p=+fp.value||0;if(!c&&!p)return alert('Enter calories or protein');(food[today()]=food[today()]||[]).push({n:window.food.value||(c&&p?'Food':c?'Calories':'Protein'),c,p});
 W('food',food);window.food.value=fc.value=fp.value='';render()}
function delF(i){food[today()].splice(i,1);W('food',food);render()}
function setG(k,v){if(+v>0){g[k]=+v;W('goals',g);render(true)}}
function adj(k,d){g[k]=Math.max(0,g[k]+d);W('goals',g);render()}
function pick(b){document.querySelectorAll('.ppl button').forEach(x=>x.className='');b.className='on';sel=b.textContent}
function addW(){if(!sel)return alert('Pick Push, Pull, or Legs');wo.push({t:sel,n:wn.value,d:wd.value||today()});W('wo',wo);wn.value='';render()}
function setOpen(o){sm.className=o?"modal on":"modal"}
function delW(i){wo.splice(i,1);W('wo',wo);render()}
wd.value=today();render();
</script></body></html>
